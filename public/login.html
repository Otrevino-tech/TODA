<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>TODA — Portal Login</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <style>
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at top, #2e0054, #0d0d0d);
        }

        .login-card {
            background: var(--grey);
            border: 1px solid var(--purple-light);
            border-top: 4px solid var(--gold);
            border-radius: var(--radius);
            padding: 2rem;
            width: min(420px, 92vw);
            box-shadow: var(--shadow);
        }

        .login-card h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            text-align: center;
            margin-bottom: .25rem;
        }

        .login-card p.sub {
            text-align: center;
            color: #aaa;
            margin-bottom: 1.5rem;
            font-size: .9rem;
        }

        .login-card label {
            display: flex;
            flex-direction: column;
            gap: .3rem;
            margin-bottom: 1rem;
            color: var(--gold);
            font-size: .85rem;
        }

        .login-card select,
        .login-card input {
            background: var(--black);
            color: var(--white);
            border: 1px solid var(--purple-light);
            border-radius: 8px;
            padding: .7rem;
            font-size: 1rem;
            font-family: inherit;
        }

        .login-card select:focus,
        .login-card input:focus {
            outline: none;
            border-color: var(--gold);
        }

        .advanced-toggle {
            color: var(--gold-light);
            font-size: .8rem;
            text-align: right;
            cursor: pointer;
            margin-bottom: .75rem;
        }

        .admin-code-wrap {
            display: none;
        }

        .admin-code-wrap.show {
            display: flex;
        }

        .error {
            color: #ef4444;
            font-size: .85rem;
            text-align: center;
            margin-top: .75rem;
            min-height: 1em;
        }
    </style>
</head>

<body>
    <form class="login-card" id="loginForm">
        <h1>👑 TODA</h1>
        <p class="sub">Enter your dorm to continue</p>
        <label>Your Dorm
            <select name="dormId" id="dormSelect" required>
                <option value="">— Loading —</option>
            </select>
        </label>
        <label>Display Name
            <input type="text" id="displayName" placeholder="e.g. Alex R." required />
        </label>
        <div class="advanced-toggle" id="advToggle">+ I'm an RA / Admin</div>
        <label class="admin-code-wrap" id="adminWrap">Admin Code
            <input type="password" id="adminCode" placeholder="RA access code" />
        </label>
        <button type="submit" class="btn-primary" style="width:100%;">Enter TODA</button>
        <div class="error" id="loginError"></div>
    </form>
    <script src="js/login.js"></script>
</body>

</html>
